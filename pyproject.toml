[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devilbox-tray"
version = "1.0.0"
description = "Tray app to control Devilbox (start/stop containers) from any SNI system tray."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]
keywords = ["devilbox", "docker", "tray", "systemtray", "wayland", "hyprland"]
authors = [{ name = "Thentik", email = "authentik50@gmail.com" }]

[project.urls]
Homepage = "https://github.com/thentik/devilbox-tray"

# gui-scripts : lanceur sans console (identique à scripts sous Linux)
[project.gui-scripts]
devilbox-tray = "devilbox_tray.app:main"

[tool.hatch.build.targets.wheel]
packages = ["devilbox_tray"]

# Les fichiers de langue (.json) sont dans le package : inclus automatiquement.
